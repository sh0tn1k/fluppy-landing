name: One-time Fluppy typography fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('docs/css/styles.css')
          text = css.read_text()
          old = '''.section-title {\n  font-family: var(--font-rounded);\n  font-size: 40px;'''
          new = '''.section-title {\n  font-family: var(--font);\n  font-size: 40px;'''
          if old not in text:
              raise SystemExit('Expected .section-title rule not found')
          text = text.replace(old, new, 1)
          css.write_text(text)

          html = Path('docs/index.html')
          text = html.read_text()
          old = '        <p class="stats__heading">Your channel. Your rules.</p>\n'
          if old not in text:
              raise SystemExit('Expected stats heading not found')
          text = text.replace(old, '', 1)
          html.write_text(text)
          PY
          rm .github/workflows/one-time-typography-fix.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/css/styles.css docs/index.html .github/workflows/one-time-typography-fix.yml
          git commit -m "Fix section title typography and remove channel rules heading"
          git push
