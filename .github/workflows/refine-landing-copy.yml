name: Refine landing SEO and AI-agent discoverability

on:
  push:
    branches: [main]

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refine copy, metadata, and machine-readable content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          # Normalize sitemap/agent discovery links so repeated workflow runs cannot duplicate them.
          s = re.sub(r'\n\s*<link rel="sitemap"[^>]*\/?>', '', s)
          s = re.sub(r'\n\s*<link rel="describedby"[^>]*\/?>', '', s)
          s = re.sub(r'\n\s*<link rel="alternate" type="text/markdown"[^>]*\/?>', '', s)
          canonical = '  <link rel="canonical" href="https://sh0tn1k.github.io/fluppy-landing/" />'
          links = '''\n  <link rel="sitemap" type="application/xml" href="https://sh0tn1k.github.io/fluppy-landing/sitemap.xml" />\n  <link rel="describedby" href="https://sh0tn1k.github.io/fluppy-landing/llms.txt" />\n  <link rel="alternate" type="text/markdown" href="https://sh0tn1k.github.io/fluppy-landing/about-fluppy.md" />'''
          s = s.replace(canonical, canonical + links, 1)

          # The keywords meta tag is ignored by major search engines; remove it instead of stuffing terms.
          s = re.sub(r'\n\s*<meta name="keywords"[^>]*\/?>', '', s, count=1)

          # Core metadata.
          s = re.sub(r'<title>.*?</title>', '<title>Fluppy — AI Assistant & Automation for Telegram Channels</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description" content="[^"]*"\s*/>', '<meta name="description" content="Fluppy automates Telegram channel content: find relevant sources, rewrite posts in your style, review drafts, schedule publishing, or run on autopilot." />', s, count=1)
          s = re.sub(r'<meta property="og:title" content="[^"]*"\s*/>', '<meta property="og:title" content="Fluppy — AI Assistant & Automation for Telegram Channels" />', s, count=1)
          s = re.sub(r'<meta property="og:description" content="[^"]*"\s*/>', '<meta property="og:description" content="Automate Telegram channel content with Fluppy: sources, AI rewriting, review, scheduling, and autopilot." />', s, count=1)
          s = re.sub(r'<meta name="twitter:title" content="[^"]*"\s*/>', '<meta name="twitter:title" content="Fluppy — AI Assistant & Automation for Telegram Channels" />', s, count=1)
          s = re.sub(r'<meta name="twitter:description" content="[^"]*"\s*/>', '<meta name="twitter:description" content="Automate Telegram channel content with Fluppy: sources, AI rewriting, review, scheduling, and autopilot." />', s, count=1)

          replacements = {
            'Keep your Telegram channel active without writing every post yourself.': 'Automate the routine work behind your Telegram channel.',
            'Fluppy finds relevant content, turns it into posts in your style, and gets them ready to publish.': 'Fluppy finds relevant content, rewrites it in your style, and gets posts ready to publish.',
            'Review every post yourself — or let Fluppy handle the routine on autopilot.': 'Review every draft in Telegram — or let Fluppy publish on autopilot.',
            'Stop spending your time finding, rewriting and scheduling posts.': 'Stop spending your time finding, rewriting and scheduling posts.',
            'Fluppy takes care of the repetitive part of running a Telegram channel: finding relevant content, turning it into a post, and preparing it for publication.': 'Fluppy handles the repetitive workflow behind a Telegram channel: finding relevant content, rewriting it to your settings, preparing drafts, and publishing when you choose.',
            'You decide what the channel should cover and how it should sound. Fluppy handles the routine.': 'You choose the topics, sources, language and style. Then choose approval or autopilot.',
            'Set your style once and use it across every draft.': 'Set the language, tone and format once and use the same style across your channel.',
            '<h3>Review everything</h3>': '<h3>Review before publishing</h3>',
            '<h3>Write it in your style</h3>': '<h3>Turn it into your posts</h3>',
            '<h3>Publish on your schedule</h3>': '<h3>Keep your channel active</h3>',
            'Post now or schedule content for later. Set how often your channel should publish.': 'Publish now, schedule content for later, or set how often your channel should publish.',
            '<h3>Translate for your audience</h3>': '<h3>Write for your audience</h3>',
            '<h2 class="section-title fade-up">How it works</h2>': '<h2 class="section-title fade-up">How Fluppy automates a Telegram channel</h2>',
            '<h3>02 — Tell Fluppy what to follow</h3>': '<h3>02 — Choose topics and sources</h3>',
            'Choose one of the ready-made topics or create your own. Add your sources if needed.': 'Choose ready-made topics or create your own. Add the sources you want Fluppy to follow.',
            '<h2 class="section-title fade-up">Everything your channel needs to stay active</h2>': '<h2 class="section-title fade-up">Key features for Telegram channel automation</h2>',
            'Use Fluppy\'s sources or add your own feeds and pages.': 'Use Fluppy\'s sources or add your own feeds, channels and pages.',
            'No new dashboard. No complicated setup.': 'Connect your channel, choose what Fluppy should follow, and set how you want your posts written.',
            '<h3>4. Choose how much control you want</h3>': '<h3>4. Choose your level of control</h3>',
            '<h2 class="cta-band__title">Your channel doesn\'t have to run itself.</h2>': '<h2 class="cta-band__title">Keep your channel active. Let Fluppy handle the routine.</h2>',
            'Let Fluppy handle the repetitive work.': 'Choose the topics. Define the style. Review every draft — or automate publishing.',
            'You choose the topics.<br />\n              You define the style.<br />\n              You decide how much control to keep.': 'Choose the topics. Define the style. Review every draft — or automate publishing.',
            '© <span id="year"></span> Fluppy. Keep your Telegram channel running.': '© <span id="year"></span> Fluppy. Telegram channel automation.'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Exact, concise FAQ language for users and answer extraction by AI systems.
          faq_pairs = {
            'Fluppy is a Telegram Mini App and bot that helps you run a channel. It finds content from your chosen sources, turns it into posts in your style, and prepares them for publishing.': 'Fluppy is a Telegram Mini App and bot for automating channel content. It finds relevant content from chosen sources, rewrites it in your style, and prepares posts for publishing.',
            'No. You can use the topics and sources provided by Fluppy or add your own.': 'No. You can use Fluppy’s ready-made topics and sources or add your own feeds, channels and pages.',
            'Yes. You can configure the language, tone, style and other rules that Fluppy should follow when creating posts.': 'Yes. You can configure the language, tone, format and other rules that Fluppy follows when creating posts.',
            'Inside Telegram — as a Mini App and bot. You don\'t need a separate app or dashboard to manage your channel.': 'Inside Telegram as a Mini App and bot. You can manage the channel workflow without a separate dashboard.'
          }
          for old, new in faq_pairs.items():
              s = s.replace(old, new)

          # Align JSON-LD with the same canonical product description.
          s = s.replace('Fluppy finds relevant content, turns it into posts in your style, and gets them ready to publish. Review every post or switch on autopilot.', 'Fluppy automates Telegram channel content: it finds relevant sources, rewrites posts in your style, prepares drafts, and supports scheduling, approval, or autopilot.')
          s = s.replace('Connect your Telegram channel, choose topics and sources, set your style, get ready-to-publish posts, then approve or automate.', 'Connect a Telegram channel, choose topics and sources, define your writing style, prepare drafts, then review, schedule, or automate publishing.')
          s = s.replace('Telegram Mini App and bot that helps you run a channel: find content from chosen sources, turn it into posts in your style, and publish with approval or autopilot.', 'Telegram Mini App and bot for automating Telegram channel content: find relevant sources, rewrite posts in your style, review drafts, schedule publishing, and run on autopilot.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update sitemap and robots
        run: |
          cat > docs/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://sh0tn1k.github.io/fluppy-landing/</loc>
              <lastmod>$(date -u +%F)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF
          cat > docs/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://sh0tn1k.github.io/fluppy-landing/sitemap.xml
          EOF

      - name: Commit refined landing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/sitemap.xml docs/robots.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refine landing copy SEO and AI discoverability [skip ci]'
          git push
