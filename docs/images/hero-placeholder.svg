<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3AA8FC"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#E8F1FF"/>
    </linearGradient>
    <linearGradient id="duck" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" rx="48" fill="url(#phoneGrad)"/>
  <text x="320" y="36" text-anchor="middle" fill="#ffffff88" font-family="system-ui,sans-serif" font-size="13" font-weight="600">IMAGE PLACEHOLDER · hero-placeholder.svg</text>
  <!-- back phone -->
  <g transform="translate(110,70) rotate(-8)">
    <rect x="0" y="0" width="220" height="420" rx="36" fill="#0A84FF" opacity=".35"/>
    <rect x="10" y="10" width="200" height="400" rx="28" fill="url(#screen)"/>
    <rect x="70" y="22" width="60" height="10" rx="5" fill="#D1D1D6"/>
    <rect x="28" y="56" width="164" height="72" rx="16" fill="#007AFF22"/>
    <rect x="28" y="144" width="164" height="48" rx="12" fill="#FF950022"/>
    <rect x="28" y="208" width="164" height="48" rx="12" fill="#34C75922"/>
    <rect x="28" y="272" width="100" height="14" rx="7" fill="#C7C7CC"/>
    <rect x="28" y="298" width="140" height="10" rx="5" fill="#E5E5EA"/>
  </g>
  <!-- front phone -->
  <g transform="translate(280,50)">
    <rect x="0" y="0" width="240" height="450" rx="40" fill="#1C1C1E"/>
    <rect x="8" y="8" width="224" height="434" rx="34" fill="url(#screen)"/>
    <rect x="80" y="20" width="80" height="22" rx="11" fill="#1C1C1E"/>
    <!-- header -->
    <circle cx="48" cy="70" r="18" fill="url(#duck)"/>
    <circle cx="44" cy="66" r="3" fill="#1C1C1E"/>
    <ellipse cx="56" cy="68" rx="6" ry="4" fill="#FF6B00"/>
    <text x="76" y="68" fill="#000" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Fluppy</text>
    <text x="76" y="84" fill="#8E8E93" font-family="system-ui,sans-serif" font-size="11">AI Channel Assistant</text>
    <!-- cards -->
    <rect x="24" y="110" width="192" height="88" rx="18" fill="#fff" stroke="#E5E5EA"/>
    <rect x="40" y="128" width="100" height="12" rx="6" fill="#007AFF"/>
    <rect x="40" y="150" width="160" height="8" rx="4" fill="#C7C7CC"/>
    <rect x="40" y="166" width="120" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="24" y="214" width="192" height="88" rx="18" fill="#fff" stroke="#E5E5EA"/>
    <rect x="40" y="232" width="80" height="12" rx="6" fill="#FF9500"/>
    <rect x="40" y="254" width="160" height="8" rx="4" fill="#C7C7CC"/>
    <rect x="40" y="270" width="140" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="24" y="318" width="192" height="56" rx="18" fill="#007AFF"/>
    <text x="120" y="352" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Approve post</text>
  </g>
</svg>
